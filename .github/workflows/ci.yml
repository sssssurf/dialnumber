name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # Project toolchain baseline, not an extra contest requirement.
      - name: Toolchain meets the required moonc version
        run: |
          moon version --all
          required=0.10.17
          actual=$(moonc -v | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "moonc $actual (required >= $required)"
          lowest=$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n 1)
          if [ "$lowest" != "$required" ]; then
            echo "::error::moonc $actual is older than the required $required"
            exit 1
          fi

      - name: Final acceptance checks
        run: node scripts/acceptance.mjs --targets js,wasm-gc --skip-bench

      - name: Acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: .cache/acceptance/

  # The README and the project description both claim the library compiles for
  # native, wasm and wasm-gc. Verifying only the default target let that claim
  # drift silently, so each target is now built explicitly.
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, native]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build (${{ matrix.target }})
        run: moon build --target ${{ matrix.target }}

      - name: Test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  # The benchmarks are committed, so they have to keep compiling and running.
  # The numbers are not asserted on (a shared runner is too noisy for that), but
  # a broken or removed benchmark fails here instead of being noticed by nobody.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Benchmarks
        run: moon bench benchmarks
